[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "raylib"
platforms = [{ platform = "linux-64", glibc = "2.38" }]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "raylib"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = ">=0.3.13" }

[tasks]
install_raylib = "bash install_raylib.sh"
test = { cmd = "python -m unittest discover -s test/raylib -p 'test_*.py'", depends-on = ["install_raylib"] }
test_raylib = { depends-on = ["test"] }
example = { cmd = "mojo run -I . examples/raylib_window.mojo .pixi/raylib/lib/libraylib.so", depends-on = ["install_raylib"] }
test_graphics = { cmd = "python test/graphics.py", depends-on = ["install_raylib"] }
test_install = "python test/install.py"
fmt = "mojo format raylib examples test"

[dependencies]
mojo = ">=1.3.0.dev2026110405,<2"
python = ">=3.15.2,<3.16"
