context:
  version: "0.1.0"
  native_version: "6.2"

package:
  name: raylib
  version: ${{ version }}

source:
  - path: raylib
    target_directory: raylib
  - url: https://github.com/raysan5/raylib/releases/download/${{ native_version }}/raylib-${{ native_version }}_linux_amd64.tar.gz
    sha256: 586bbc32f3596d439382b1c5dbc6c1c573eb7e1d00fe92be7d4deb116883720d
    target_directory: native

build:
  script:
    - mkdir -p "$PREFIX/lib/mojo" "$PREFIX/include"
    - cp -R raylib "$PREFIX/lib/mojo/"
    - cp -a native/lib/libraylib.so* "$PREFIX/lib/"
    - cp -a native/include/. "$PREFIX/include/"

requirements:
  build:
    - patchelf
  host:
    - xorg-libx11
  run:
    - mojo ==1.3.0.dev2026110405
    - xorg-libx11
    - __glibc >=2.38

about:
  summary: Mojo bindings and native runtime for raylib 6.2
